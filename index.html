<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Заказы Авито</title>
  <script type="text/javascript" src="https://gc.kes.v2.scr.kaspersky-labs.com/7EA5E9BB-55E1-4C31-9C21-4943DDFED2E4/main.js?attr=xEKe5w1MGZFPFmDMHOL8S2bdeukchGhEyEbflyfDB4YJ3SGuMYnhm7wdaW8YdiCspSMS0LWapWNnN9zD3s3Rn6iPxHd-PioK2xMYDANmvPKS_HirwRuoJvSyKR0gpCvsnFed0AW-faorhBgoEFfFhF77Ct-L_r6yrOSA6ljW6Ji1GkR3IOxn89VF1nUGD9yj2lpR3fiy82KmnXKGSmx17bUVrX5OaZ1LHknJ9lPAwIqQB3BA4l2i_BIoCEUQmLIgCV2_hd85csmRONWm06X4-W3n-o5dHLHOU4zFRg4_GiboaqrPZuVEJUFTNo89Cnl9w9KaweyrdhmsV8mHq0FsYg" charset="UTF-8"></script><style>
    :root {
      --bg: #f0f4f9;
      --card: #ffffff;
      --text: #1f1f1f;
      --muted: #5f6368;
      --primary: #1a73e8;
      --primary-text: #ffffff;
      --field-bg: #f1f3f4;
      --border: #dadce0;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --warning: #d97706;
      --warning-bg: #fef3c7;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #18181b;
        --card: #27272a;
        --text: #f4f4f5;
        --muted: #a1a1aa;
        --primary: #3b82f6;
        --primary-text: #ffffff;
        --field-bg: #3f3f46;
        --border: #52525b;
        --danger: #f87171;
        --danger-bg: rgba(239, 68, 68, 0.2);
        --success: #4ade80;
        --success-bg: rgba(34, 197, 94, 0.2);
        --warning: #fbbf24;
        --warning-bg: rgba(245, 158, 11, 0.2);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 12px 12px 95px 12px;
      max-width: 540px;
      margin: 0 auto;
    }

    /* Переключатель ролей */
    .role-switcher {
      display: flex;
      background: var(--card);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .role-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 9px 4px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
    }
    .role-btn.active {
      background: var(--primary);
      color: var(--primary-text);
    }

    /* Финансовое табло */
    .kpi-banner {
      background: var(--card);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      border-left: 5px solid var(--danger);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .kpi-banner.zero-debt {
      border-left-color: var(--success);
    }
    .kpi-info { flex: 1; }
    .kpi-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      font-weight: 700;
    }
    .kpi-amount {
      font-size: 26px;
      font-weight: 800;
      color: var(--danger);
      margin: 2px 0;
    }
    .kpi-banner.zero-debt .kpi-amount {
      color: var(--success);
    }
    .kpi-sub {
      font-size: 12px;
      color: var(--muted);
    }
    .btn-pay-all {
      background: var(--success);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    /* Вкладки фильтров */
    .filter-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .filter-tab {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .filter-tab.active {
      background: var(--primary);
      color: var(--primary-text);
      border-color: var(--primary);
    }
    .tab-count {
      background: rgba(128,128,128,0.25);
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 11px;
    }

    /* Карточка заказа */
    .task-card {
      background: var(--card);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .check-circle {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--muted);
      flex-shrink: 0;
      margin-top: 2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: transparent;
    }
    .check-circle.done {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }
    .task-body { flex: 1; min-width: 0; }
    .task-title {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 6px;
      word-break: break-word;
    }
    .task-title.done-text {
      text-decoration: line-through;
      opacity: 0.6;
    }
    .badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 8px;
    }
    .badge-work { background: var(--warning-bg); color: var(--warning); }
    .badge-done { background: rgba(59, 130, 246, 0.18); color: var(--primary); }
    .badge-unpaid { background: var(--danger-bg); color: var(--danger); }
    .badge-paid { background: var(--success-bg); color: var(--success); }

    .price-box {
      background: var(--field-bg);
      border-radius: 12px;
      padding: 8px 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .price-main { font-size: 16px; font-weight: 800; }
    .price-old {
      font-size: 12px;
      color: var(--muted);
      text-decoration: line-through;
      margin-left: 6px;
    }
    .btn-small {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .task-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.4;
      margin-bottom: 8px;
      white-space: pre-wrap;
    }
    .worker-note {
      font-size: 12px;
      background: rgba(59, 130, 246, 0.12);
      border-left: 3px solid var(--primary);
      padding: 6px 10px;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .avito-link {
      display: inline-block;
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
      text-decoration: none;
      margin-bottom: 8px;
    }

    .gallery-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0;
      margin-bottom: 6px;
    }
    .gallery-thumb {
      width: 76px;
      height: 76px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid var(--border);
      flex-shrink: 0;
      cursor: pointer;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .action-btn {
      flex: 1;
      min-width: 105px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--field-bg);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .action-btn.primary { background: var(--primary); color: var(--primary-text); border-color: var(--primary); }
    .action-btn.success { background: var(--success); color: #fff; border-color: var(--success); }
    .action-btn.danger { color: var(--danger); border-color: var(--danger); }

    .fab {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--primary);
      color: var(--primary-text);
      border: none;
      border-radius: 28px;
      padding: 14px 22px;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 50;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-backdrop.open { display: flex; }
    .google-modal {
      background: var(--card);
      width: 100%;
      max-width: 460px;
      border-radius: 24px;
      padding: 20px;
      border: 1px solid var(--border);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .modal-title { font-size: 18px; font-weight: 700; }
    .close-btn { background: transparent; border: none; font-size: 22px; color: var(--muted); cursor: pointer; }
    .gt-title-input {
      width: 100%;
      border: none;
      border-bottom: 2px solid var(--border);
      background: transparent;
      color: var(--text);
      font-size: 17px;
      font-weight: 600;
      padding: 8px 0;
      margin-bottom: 14px;
      outline: none;
    }
    .gt-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .gt-field {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--field-bg);
      color: var(--text);
      border-radius: 12px;
      padding: 11px 13px;
      font-size: 14px;
      outline: none;
      margin-bottom: 10px;
    }
    textarea.gt-field { min-height: 75px; resize: vertical; font-family: inherit; }

    .upload-dropzone {
      border: 2px dashed var(--border);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .preview-list { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .preview-item { position: relative; width: 68px; height: 68px; }
    .preview-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); }
    .preview-del {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--danger);
      color: #fff;
      border: none;
      font-size: 11px;
      cursor: pointer;
    }
    .gt-save-btn {
      width: 100%;
      background: var(--primary);
      color: var(--primary-text);
      border: none;
      border-radius: 18px;
      padding: 13px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 16px;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 100%; max-height: 80vh; border-radius: 8px; object-fit: contain; }
    .lightbox-controls { margin-top: 16px; display: flex; gap: 10px; }
    .lb-btn {
      background: rgba(255,255,255,0.2);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .empty-box { text-align: center; padding: 36px 16px; color: var(--muted); font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>

  <div class="role-switcher">
    <button class="role-btn" id="role-agent" onclick="setRole('agent')">Посредник</button>
    <button class="role-btn" id="role-worker" onclick="setRole('worker')">Исполнитель</button>
    <button class="role-btn" id="role-admin" onclick="setRole('admin')">Админ</button>
  </div>

  <div class="kpi-banner zero-debt" id="kpiBanner">
    <div class="kpi-info">
      <div class="kpi-label" id="kpiLabel">К ВЫПЛАТЕ ИСПОЛНИТЕЛЮ</div>
      <div class="kpi-amount" id="kpiAmount">0 ₽</div>
      <div class="kpi-sub" id="kpiSub">Синхронизация...</div>
    </div>
    <button class="btn-pay-all" id="payAllBtn" style="display:none;" onclick="payAllCompleted()">💳 Выплатить всё</button>
  </div>

  <div class="filter-tabs">
    <button class="filter-tab active" id="tab-active" onclick="setFilter('active')">
      🔥 В работе <span class="tab-count" id="cnt-active">0</span>
    </button>
    <button class="filter-tab" id="tab-unpaid" onclick="setFilter('unpaid')">
      ⏳ Ждут выплаты <span class="tab-count" id="cnt-unpaid">0</span>
    </button>
    <button class="filter-tab" id="tab-all" onclick="setFilter('all')">
      ✅ Все <span class="tab-count" id="cnt-all">0</span>
    </button>
  </div>

  <div id="ordersContainer">
    <div class="empty-box">Загрузка списка...</div>
  </div>

  <button class="fab" id="fabBtn" onclick="openCreateModal()">
    <span>＋</span> Новый заказ
  </button>

  <div class="modal-backdrop" id="createModal">
    <div class="google-modal">
      <div class="modal-header">
        <div class="modal-title">Новое задание с Авито</div>
        <button class="close-btn" onclick="closeCreateModal()">✕</button>
      </div>

      <input type="text" id="inpTitle" class="gt-title-input" placeholder="Добавьте название товара">

      <div class="gt-row">
        <input type="number" id="inpPrice" class="gt-field" style="margin-bottom:0;" placeholder="Цена / Бюджет (₽)">
        <select id="inpPaidInit" class="gt-field" style="margin-bottom:0;">
          <option value="Не выплачено">Не выплачено</option>
          <option value="Выплачено">Сразу выплачено</option>
        </select>
      </div>

      <input type="url" id="inpUrl" class="gt-field" placeholder="Ссылка на объявление Авито (необязательно)">

      <textarea id="inpDesc" class="gt-field" placeholder="Добавьте описание (что проверить, торг, доставка)"></textarea>

      <div class="upload-dropzone" onclick="document.getElementById('inpFiles').click()">
        <div style="font-size:24px; margin-bottom:4px;">📷</div>
        <div style="font-size:13px; color:var(--muted);">
          Выбрать скриншоты (любое кол-во)<br>или вставить через <b>Ctrl + V</b>
        </div>
        <input type="file" id="inpFiles" multiple accept="image/*" style="display:none" onchange="handleFilesSelect(this.files)">
      </div>

      <div class="preview-list" id="previewList"></div>

      <button class="gt-save-btn" id="saveOrderBtn" onclick="submitNewOrder()">Сохранить</button>
    </div>
  </div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightboxImg" src="" onclick="event.stopPropagation()">
    <div class="lightbox-controls" onclick="event.stopPropagation()">
      <button class="lb-btn" onclick="prevPhoto()">◀</button>
      <button class="lb-btn" id="lbCounter">1 / 1</button>
      <button class="lb-btn" onclick="nextPhoto()">▶</button>
      <button class="lb-btn" onclick="closeLightbox()">✕</button>
    </div>
  </div>

  <script>
    // 1. МГНОВЕННАЯ ИНИЦИАЛИЗАЦИЯ TELEGRAM MINI APP (без скачивания скрипта с заблокированного telegram.org)
    (function initTelegramInstant() {
      try {
        if (window.TelegramWebviewProxy) {
          window.TelegramWebviewProxy.postEvent('web_app_ready', '');
          window.TelegramWebviewProxy.postEvent('web_app_expand', '');
        } else if (window.external && window.external.notify) {
          window.external.notify(JSON.stringify({ eventType: 'web_app_ready', eventData: {} }));
          window.external.notify(JSON.stringify({ eventType: 'web_app_expand', eventData: {} }));
        } else if (window.parent && window.parent !== window) {
          window.parent.postMessage(JSON.stringify({ eventType: 'web_app_ready', eventData: {} }), '*');
          window.parent.postMessage(JSON.stringify({ eventType: 'web_app_expand', eventData: {} }), '*');
        }
      } catch (e) {}
    })();

    // 2. ПРЯМЫЕ НАСТРОЙКИ SUPABASE (0 внешних библиотек)
    const SUPABASE_URL = 'https://vzsbdvwtwcvbqhcbssfi.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_yeu1O6x7OfgNi7sRhpV8SA_s3uxOGaU';

    let currentRole = localStorage.getItem('avito_role') || 'agent';
    let currentFilter = 'active';
    let allOrders = [];
    let stagedFiles = [];
    let lbPhotos = [];
    let lbIndex = 0;

    // 3. МГНОВЕННАЯ ОТРИСОВКА ИЗ ЛОКАЛЬНОГО КЭША (открытие за 0.01 сек)
    try {
      const cached = localStorage.getItem('avito_orders_cache');
      if (cached) {
        allOrders = JSON.parse(cached);
      }
    } catch (e) {}

    async function dbSelectOrders() {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/orders?select=*&order=id.desc`, {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`
        }
      });
      if (!res.ok) throw new Error(`Код ${res.status}: ${await res.text()}`);
      return await res.json();
    }

    async function dbInsertOrder(orderObj) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/orders`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(orderObj)
      });
      if (!res.ok) throw new Error(await res.text());
    }

    async function dbUpdateOrder(queryFilter, updateObj) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/orders?${queryFilter}`, {
        method: 'PATCH',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(updateObj)
      });
      if (!res.ok) throw new Error(await res.text());
    }

    async function dbDeleteOrder(id) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/orders?id=eq.${id}`, {
        method: 'DELETE',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`
        }
      });
      if (!res.ok) throw new Error(await res.text());
    }

    async function storageUploadPhoto(fileName, blob) {
      const res = await fetch(`${SUPABASE_URL}/storage/v1/object/avito-screens/${fileName}`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'image/jpeg',
          'x-upsert': 'true'
        },
        body: blob
      });
      if (!res.ok) throw new Error(await res.text());
      return `${SUPABASE_URL}/storage/v1/object/public/avito-screens/${fileName}`;
    }

    function setRole(role) {
      currentRole = role;
      localStorage.setItem('avito_role', role);
      ['agent', 'worker', 'admin'].forEach(r => {
        document.getElementById('role-' + r).classList.toggle('active', r === role);
      });
      document.getElementById('fabBtn').style.display = (role === 'worker') ? 'none' : 'flex';
      document.getElementById('kpiLabel').innerText = (role === 'worker') ? 'ОЖИДАЮ К ВЫПЛАТЕ' : 'К ВЫПЛАТЕ ИСПОЛНИТЕЛЮ';
      renderOrders();
    }

    function setFilter(filter) {
      currentFilter = filter;
      ['active', 'unpaid', 'all'].forEach(f => {
        document.getElementById('tab-' + f).classList.toggle('active', f === filter);
      });
      renderOrders();
    }

    function openCreateModal() { document.getElementById('createModal').classList.add('open'); }
    function closeCreateModal() { document.getElementById('createModal').classList.remove('open'); }

    window.addEventListener('paste', async (e) => {
      const items = e.clipboardData?.items || [];
      const files = [];
      for (let item of items) {
        if (item.type.indexOf('image') !== -1) files.push(item.getAsFile());
      }
      if (files.length > 0) {
        if (!document.getElementById('createModal').classList.contains('open')) openCreateModal();
        await handleFilesSelect(files);
      }
    });

    function compressImage(file, maxWidth = 1280, quality = 0.8) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            canvas.toBlob((blob) => {
              resolve({ blob: blob || file, previewUrl: URL.createObjectURL(blob || file) });
            }, 'image/jpeg', quality);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function handleFilesSelect(fileList) {
      for (const file of Array.from(fileList)) {
        stagedFiles.push(await compressImage(file));
      }
      renderPreviews();
    }

    function renderPreviews() {
      document.getElementById('previewList').innerHTML = stagedFiles.map((item, idx) => `
        <div class="preview-item">
          <img src="${item.previewUrl}">
          <button class="preview-del" onclick="removeStaged(${idx})">✕</button>
        </div>
      `).join('');
    }

    function removeStaged(idx) { stagedFiles.splice(idx, 1); renderPreviews(); }

    async function submitNewOrder() {
      const title = document.getElementById('inpTitle').value.trim();
      const price = parseFloat(document.getElementById('inpPrice').value) || 0;
      const paidInit = document.getElementById('inpPaidInit').value;
      const avitoUrl = document.getElementById('inpUrl').value.trim();
      const instruction = document.getElementById('inpDesc').value.trim();

      if (!title) return alert('Введите название заказа!');

      const btn = document.getElementById('saveOrderBtn');
      btn.disabled = true;
      btn.innerText = 'Загрузка фото...';

      try {
        const uploadedUrls = [];
        for (let i = 0; i < stagedFiles.length; i++) {
          const fileName = `order_${Date.now()}_${i}_${Math.random().toString(36).substring(2, 7)}.jpg`;
          const pubUrl = await storageUploadPhoto(fileName, stagedFiles[i].blob);
          uploadedUrls.push(pubUrl);
        }

        btn.innerText = 'Сохранение...';
        await dbInsertOrder({
          title,
          avito_url: avitoUrl,
          instruction,
          initial_price: price,
          final_price: price,
          status: 'В работе',
          payment_status: paidInit,
          photos: uploadedUrls
        });

        document.getElementById('inpTitle').value = '';
        document.getElementById('inpPrice').value = '';
        document.getElementById('inpUrl').value = '';
        document.getElementById('inpDesc').value = '';
        stagedFiles = [];
        renderPreviews();
        closeCreateModal();
        await fetchOrders();
      } catch (err) {
        alert('Ошибка сохранения: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Сохранить';
      }
    }

    async function fetchOrders() {
      try {
        allOrders = await dbSelectOrders();
        localStorage.setItem('avito_orders_cache', JSON.stringify(allOrders));
        renderOrders();
      } catch (err) {
        if (!allOrders.length) {
          document.getElementById('ordersContainer').innerHTML =
            `<div class="empty-box">⚠️ Ошибка связи с базой:<br><small>${escapeHtml(err.message)}</small></div>`;
        }
      }
    }

    function renderOrders() {
      const activeOrders = allOrders.filter(o => o.status !== 'Выполнен');
      const unpaidCompleted = allOrders.filter(o => o.status === 'Выполнен' && o.payment_status === 'Не выплачено');

      document.getElementById('cnt-active').innerText = activeOrders.length;
      document.getElementById('cnt-unpaid').innerText = unpaidCompleted.length;
      document.getElementById('cnt-all').innerText = allOrders.length;

      const totalDebt = unpaidCompleted.reduce((acc, o) => acc + (Number(o.final_price) || 0), 0);
      document.getElementById('kpiBanner').classList.toggle('zero-debt', totalDebt === 0);
      document.getElementById('kpiAmount').innerText = totalDebt.toLocaleString('ru-RU') + ' ₽';
      document.getElementById('kpiSub').innerText = unpaidCompleted.length > 0
        ? `Выполнено и ждет оплаты: ${unpaidCompleted.length} шт.`
        : 'Все выполненные заказы оплачены 🎉';

      document.getElementById('payAllBtn').style.display =
        (unpaidCompleted.length > 0 && (currentRole === 'agent' || currentRole === 'admin')) ? 'block' : 'none';

      let listToRender = allOrders;
      if (currentFilter === 'active') listToRender = activeOrders;
      else if (currentFilter === 'unpaid') listToRender = unpaidCompleted;

      const container = document.getElementById('ordersContainer');
      if (listToRender.length === 0) {
        container.innerHTML = `<div class="empty-box">В этой вкладке пока нет заказов ✨<br>Нажмите «＋ Новый заказ» внизу экрана</div>`;
        return;
      }

      container.innerHTML = listToRender.map(o => {
        const isDone = o.status === 'Выполнен';
        const isPaid = o.payment_status === 'Выплачено';
        const photos = Array.isArray(o.photos) ? o.photos : [];
        const priceChanged = Number(o.initial_price) !== Number(o.final_price);

        const galleryHtml = photos.length > 0
          ? `<div class="gallery-strip">` +
              photos.map((url, idx) =>
                `<img src="${url}" class="gallery-thumb" onclick='openLightbox(${JSON.stringify(photos)}, ${idx})'>`
              ).join('') +
            `</div>`
          : '';

        let actionsHtml = '';
        if (currentRole === 'worker' || currentRole === 'admin') {
          actionsHtml += `
            <button class="action-btn ${isDone ? '' : 'primary'}" onclick="toggleDone(${o.id}, '${o.status}')">
              ${isDone ? '↩ В работу' : '✅ Выполнено'}
            </button>
            <button class="action-btn" onclick="changePrice(${o.id}, ${o.final_price})">
              ✏️ Цена
            </button>
            <button class="action-btn" onclick="editWorkerNote(${o.id}, ${JSON.stringify(o.worker_comment || '')})">
              💬 Заметка
            </button>
          `;
        }
        if (currentRole === 'agent' || currentRole === 'admin') {
          actionsHtml += `
            <button class="action-btn ${isPaid ? '' : 'success'}" onclick="togglePaid(${o.id}, '${o.payment_status}')">
              ${isPaid ? '🔄 Снять оплату' : '💳 Выплачено'}
            </button>
            <button class="action-btn" onclick="triggerAddPhotos(${o.id})">➕ Фото</button>
          `;
        }
        if (currentRole === 'admin') {
          actionsHtml += `<button class="action-btn danger" onclick="deleteOrder(${o.id})">🗑 Удалить</button>`;
        }

        return `
          <div class="task-card">
            <div class="check-circle ${isDone ? 'done' : ''}" onclick="toggleDone(${o.id}, '${o.status}')">✓</div>
            <div class="task-body">
              <div class="task-title ${isDone ? 'done-text' : ''}">${escapeHtml(o.title)}</div>
              <div class="badges">
                <span class="badge ${isDone ? 'badge-done' : 'badge-work'}">${o.status}</span>
                <span class="badge ${isPaid ? 'badge-paid' : 'badge-unpaid'}">${o.payment_status}</span>
              </div>
              <div class="price-box">
                <div>
                  <span class="price-main">${Number(o.final_price || 0).toLocaleString('ru-RU')} ₽</span>
                  ${priceChanged ? `<span class="price-old">${Number(o.initial_price || 0).toLocaleString('ru-RU')} ₽</span>` : ''}
                </div>
                ${(currentRole === 'worker' || currentRole === 'admin')
                  ? `<button class="btn-small" onclick="changePrice(${o.id}, ${o.final_price})">Изм. цену</button>` : ''}
              </div>
              ${o.instruction ? `<div class="task-desc">${escapeHtml(o.instruction)}</div>` : ''}
              ${o.worker_comment ? `<div class="worker-note"><b>Исполнитель:</b> ${escapeHtml(o.worker_comment)}</div>` : ''}
              ${o.avito_url ? `<a href="${o.avito_url}" target="_blank" class="avito-link">↗ Открыть объявление на Авито</a>` : ''}
              ${galleryHtml}
              <div class="card-actions">${actionsHtml}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function toggleDone(id, currentStatus) {
      await dbUpdateOrder(`id=eq.${id}`, { status: currentStatus === 'Выполнен' ? 'В работе' : 'Выполнен' });
      await fetchOrders();
    }

    async function togglePaid(id, currentPaid) {
      await dbUpdateOrder(`id=eq.${id}`, { payment_status: currentPaid === 'Выплачено' ? 'Не выплачено' : 'Выплачено' });
      await fetchOrders();
    }

    async function payAllCompleted() {
      if (!confirm('Отметить все выполненные заказы как «Выплачено»?')) return;
      await dbUpdateOrder(`status=eq.Выполнен&payment_status=eq.Не выплачено`, { payment_status: 'Выплачено' });
      await fetchOrders();
    }

    async function changePrice(id, currentPrice) {
      const input = prompt('Введите актуальную итоговую цену заказа (₽):', currentPrice);
      if (input === null) return;
      const num = parseFloat(input.replace(',', '.'));
      if (isNaN(num)) return alert('Введите корректное число!');
      await dbUpdateOrder(`id=eq.${id}`, { final_price: num });
      await fetchOrders();
    }

    async function editWorkerNote(id, currentNote) {
      const note = prompt('Комментарий исполнителя (трек-номер, итог торга и т.д.):', currentNote || '');
      if (note === null) return;
      await dbUpdateOrder(`id=eq.${id}`, { worker_comment: note.trim() });
      await fetchOrders();
    }

    function triggerAddPhotos(orderId) {
      const input = document.createElement('input');
      input.type = 'file'; input.multiple = true; input.accept = 'image/*';
      input.onchange = async (e) => {
        const files = Array.from(e.target.files);
        if (!files.length) return;
        const order = allOrders.find(x => x.id === orderId);
        const existingPhotos = Array.isArray(order?.photos) ? [...order.photos] : [];
        for (let i = 0; i < files.length; i++) {
          const comp = await compressImage(files[i]);
          const fileName = `order_${orderId}_${Date.now()}_${i}.jpg`;
          const pubUrl = await storageUploadPhoto(fileName, comp.blob);
          existingPhotos.push(pubUrl);
        }
        await dbUpdateOrder(`id=eq.${orderId}`, { photos: existingPhotos });
        await fetchOrders();
      };
      input.click();
    }

    async function deleteOrder(id) {
      if (!confirm('Удалить этот заказ навсегда?')) return;
      await dbDeleteOrder(id);
      await fetchOrders();
    }

    function openLightbox(photos, index) {
      lbPhotos = photos; lbIndex = index; updateLightbox();
      document.getElementById('lightbox').classList.add('open');
    }
    function updateLightbox() {
      document.getElementById('lightboxImg').src = lbPhotos[lbIndex];
      document.getElementById('lbCounter').innerText = `${lbIndex + 1} / ${lbPhotos.length}`;
    }
    function prevPhoto() { lbIndex = (lbIndex - 1 + lbPhotos.length) % lbPhotos.length; updateLightbox(); }
    function nextPhoto() { lbIndex = (lbIndex + 1) % lbPhotos.length; updateLightbox(); }
    function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Старт без задержек
    setRole(currentRole);
    fetchOrders();
  </script>
</body>
</html>
